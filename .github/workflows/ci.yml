name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit the toolchain (the extension itself ships 0 runtime deps)
        run: npm audit --audit-level=high
      - name: Version check (manifest.json vs package.json)
        run: npm run check:version
      - name: Lint
        run: npm run lint
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Unit, overlay and loaded-extension tests
        run: npm test
      - name: Pack and check the zip holds exactly the extension
        shell: bash
        run: |
          npm run pack
          unzip -Z1 snake-eyes-*.zip | sort > /tmp/packed.txt
          cat /tmp/packed.txt
          diff <(printf 'background.js\nicons/icon-128.png\nicons/icon-16.png\nicons/icon-32.png\nicons/icon-48.png\nlib/pure.js\nmanifest.json\noverlay.css\noverlay.js\npanel.css\n') /tmp/packed.txt
